  <!--
    Font families are declared as CSS variables by @infonomic/uikit's
    typography plugin (Inter, Roboto, Merriweather, Source Code Pro).
    The consumer app is expected to load the actual fonts — this app
    pulls them from Google Fonts. Swap for a self-hosted loader or
    @fontsource packages if you prefer.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300..700;1,400&family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Code+Pro:wght@300;400;500&display=swap"
  />

  <!--
    Early theme detector: runs synchronously before hydration so the initial
    paint matches the user's preferred theme (no FOUC). Mirrors the logic of
    src/ui/theme/early-theme-detector.tsx in the SSR sibling app. The "force"
    constant here corresponds to the `force` prop passed to <ThemeProvider/>
    in src/routes/__root.tsx — keep them in sync.
  -->
  <script id="theme-detection">
    (() => {
      const classList = document.documentElement.classList;
      const style = document.documentElement.style;
      const system = window.matchMedia('(prefers-color-scheme: dark)');
      const force = 'dark';
      let theme = localStorage.theme;
      if (theme != null && theme !== 'dark' && theme !== 'light') {
        localStorage.removeItem('theme');
        theme = null;
      }

      if (theme == null) {
        if (force == null || force.length === 0) {
          if (system.matches) {
            classList.remove('light');
            classList.add('dark');
            style.colorScheme = 'dark';
          } else {
            classList.remove('dark');
            classList.add('light');
            style.colorScheme = 'light';
          }
        } else {
          localStorage.setItem('theme', force);
          classList.remove('light');
          classList.remove('dark');
          classList.add(force);
          style.colorScheme = force;
        }
      } else {
        if (theme === 'dark') {
          classList.remove('light');
          classList.add('dark');
          style.colorScheme = 'dark';
        } else if (theme === 'light') {
          classList.remove('dark');
          classList.add('light');
          style.colorScheme = 'light';
        }
      }
    })();
  </script>
